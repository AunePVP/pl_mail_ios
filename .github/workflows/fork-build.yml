# FORK (FORK.md 1): builds the app on GitHub's macOS runners, because nobody
# working on this fork has a Mac.
#
# - pull_request: package tests + simulator builds for iPhone and iPad, the
#   "definition of done" from docs/parity/PLAN.md.
# - push to main / manual run: an UNSIGNED .ipa. It is signed per device by
#   AltServer with each person's free Apple ID (FORK.md 1), so nothing here
#   holds a certificate or an Apple account. Published as the rolling
#   pre-release `latest` so the signing host can fetch it from a fixed URL.
name: Fork build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      keep_widget:
        description: "Keep the widget extension in the .ipa (useless without a paid team)"
        type: boolean
        default: false

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Package tests
        run: swift test --package-path Packages/PLMail
      # Release, like the .ipa: it treats warnings as errors, and a warning
      # that only fails the build after the merge means no app at all.
      - name: Simulator build (iPhone, Release)
        run: >
          xcodebuild build -project plMail.xcodeproj -scheme plMail
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          || { grep -E "error:|warning:" build.log | sort -u | head -60; tail -n 20 build.log; exit 1; }
      - name: Lint
        run: swift format lint --strict --recursive App Packages

  ipa:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Archive (unsigned)
        run: |
          xcodebuild archive -project plMail.xcodeproj -scheme plMail \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/plMail.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} > build.log 2>&1 \
            || { grep -E "error:|warning:" build.log | sort -u | head -60; tail -n 20 build.log; exit 1; }
      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/plMail.xcarchive/Products/Applications/plMail.app build/ipa/Payload/
          # A free Apple ID cannot give the widget its App Group, and every
          # extension costs one of the account's ten App IDs per week, so it
          # is left out unless asked for.
          if [ "${{ inputs.keep_widget }}" != "true" ]; then
            rm -rf build/ipa/Payload/plMail.app/PlugIns
          fi
          (cd build/ipa && zip -qry ../plMail.ipa Payload)
          ls -l build/plMail.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: plMail-ipa
          path: build/plMail.ipa
          retention-days: 30
      - name: Publish as pre-release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest build/plMail.ipa --prerelease \
            --target "${GITHUB_SHA}" --title "Unsigned build ${GITHUB_SHA::7}" \
            --notes "Unsigned .ipa from ${GITHUB_SHA}, built $(date -u +%F). Signed per device by AltServer, see FORK.md."
